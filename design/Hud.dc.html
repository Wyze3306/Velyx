<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #3DDC84; text-decoration: none; }
    a:hover { color: #7CFFB2; }
    * { box-sizing: border-box; }
    .vx-hud { cursor: move; }
    .vx-hud:hover { outline: 1px solid rgba(255,255,255,0.18); outline-offset: 3px; border-radius: 10px; }
    .vx-tool:hover { background: #2A2F35 !important; }
    .vx-tool-danger:hover { background: rgba(232,96,78,0.16) !important; }
  </style>
</helmet>

<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0B0D0F; font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; color: #ECEFF2;">

  <div style="position: absolute; inset: 0; background: linear-gradient(168deg, #15202B 0%, #0F1519 42%, #0B0D0F 100%);"></div>
  <div style="position: absolute; left: -60px; bottom: -40px; width: 520px; height: 420px; transform: skewY(-8deg); background: rgba(255,255,255,0.022);"></div>
  <div style="position: absolute; right: -80px; top: 60px; width: 460px; height: 520px; transform: skewY(6deg); background: rgba(255,255,255,0.016);"></div>
  <div style="position: absolute; left: 300px; bottom: 0; width: 700px; height: 210px; background: rgba(0,0,0,0.28);"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.42) 100%);"></div>

  <div style="{{gridStyle}}"></div>

  <div style="position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px;">
    <span style="position: absolute; left: 12px; top: 0; width: 2px; height: 8px; background: rgba(255,255,255,0.82); border-radius: 1px;"></span>
    <span style="position: absolute; left: 12px; bottom: 0; width: 2px; height: 8px; background: rgba(255,255,255,0.82); border-radius: 1px;"></span>
    <span style="position: absolute; top: 12px; left: 0; width: 8px; height: 2px; background: rgba(255,255,255,0.82); border-radius: 1px;"></span>
    <span style="position: absolute; top: 12px; right: 0; width: 8px; height: 2px; background: rgba(255,255,255,0.82); border-radius: 1px;"></span>
  </div>

  <div class="vx-hud" onClick="{{ pickFps }}" style="{{fpsBox}}">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: {{accent}};">FPS</span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500;">312</span>
  </div>

  <div class="vx-hud" onClick="{{ pickCps }}" style="{{cpsBox}}">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: {{accent}};">CPS</span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500;">8</span>
  </div>

  <div class="vx-hud" onClick="{{ pickCoords }}" style="{{coordsBox}}">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: {{accent}};">XYZ</span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500;">148 &#8239;71 &#8239;-402</span>
    <span style="font-size: 11px; color: #9AA3AC; margin-left: 4px;">NE</span>
  </div>

  <div class="vx-hud" onClick="{{ pickKeys }}" style="{{keysBox}}">
    <div style="display: flex; justify-content: center;">
      <span style="{{keyOn}}">Z</span>
    </div>
    <div style="display: flex; gap: 4px;">
      <span style="{{keyOff}}">Q</span>
      <span style="{{keyOn}}">S</span>
      <span style="{{keyOff}}">D</span>
    </div>
    <div style="display: flex; gap: 4px;">
      <span style="{{keyWide}}">8</span>
      <span style="{{keyWide}}">0</span>
    </div>
  </div>

  <div class="vx-hud" onClick="{{ pickPing }}" style="{{pingBox}}">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: {{accent}};">PING</span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500;">24 ms</span>
  </div>

  <div class="vx-hud" onClick="{{ pickGraph }}" style="{{graphBox}}">
    <div style="display: flex; align-items: flex-end; gap: 2px; height: 30px;">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="18">
        <span style="{{b.style}}"></span>
      </sc-for>
    </div>
    <div style="display: flex; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: #7C858F;">
      <span>moy 312</span><span>1% 208</span>
    </div>
  </div>

  <div style="{{guideV}}"></div>
  <div style="{{guideH}}"></div>
  <div style="{{gapBadge}}">{{gapText}}</div>

  <div style="{{ringStyle}}">
    <span style="{{h1}}"></span><span style="{{h2}}"></span><span style="{{h3}}"></span><span style="{{h4}}"></span>
  </div>

  <div style="{{toolbarStyle}}">
    <span style="display: flex; align-items: center; padding: 0 6px 0 8px; cursor: move;">
      <svg width="10" height="14" viewBox="0 0 10 14" fill="none"><circle cx="2.5" cy="3" r="1.1" fill="#7C858F"/><circle cx="7.5" cy="3" r="1.1" fill="#7C858F"/><circle cx="2.5" cy="7" r="1.1" fill="#7C858F"/><circle cx="7.5" cy="7" r="1.1" fill="#7C858F"/><circle cx="2.5" cy="11" r="1.1" fill="#7C858F"/><circle cx="7.5" cy="11" r="1.1" fill="#7C858F"/></svg>
    </span>
    <span style="font-size: 11.5px; font-weight: 500; padding-right: 4px;">{{selName}}</span>
    <span style="width: 1px; height: 16px; background: #2E343B;"></span>
    <span class="vx-tool" onClick="{{ openSettings }}" style="display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 7px; cursor: pointer;">
      <svg width="14" height="14" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="2.2" stroke="#9AA3AC" stroke-width="1.4"/><path d="M7.5 1.6v1.8M7.5 11.6v1.8M13.4 7.5h-1.8M3.4 7.5H1.6M11.7 3.3l-1.3 1.3M4.6 10.4l-1.3 1.3M11.7 11.7l-1.3-1.3M4.6 4.6L3.3 3.3" stroke="#9AA3AC" stroke-width="1.4" stroke-linecap="round"/></svg>
    </span>
    <span class="vx-tool" onClick="{{ toggleLock }}" style="display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 7px; cursor: pointer;">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="3" y="6.2" width="8" height="6" rx="1.6" stroke="{{lockColor}}" stroke-width="1.4"/><path d="M5 6.2V4.6a2 2 0 014 0v1.6" stroke="{{lockColor}}" stroke-width="1.4" stroke-linecap="round"/></svg>
    </span>
    <span class="vx-tool-danger" onClick="{{ hideSel }}" style="display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 7px; cursor: pointer;">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M3 3l7 7M10 3l-7 7" stroke="#E8604E" stroke-width="1.6" stroke-linecap="round"/></svg>
    </span>
  </div>

  <div style="position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 10px 0 16px; background: rgba(19,21,24,0.94); border: 1px solid #2A2F35; border-radius: 14px; box-shadow: 0 12px 34px rgba(0,0,0,0.55);">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.01em;">Éditeur de HUD</span>
    <span style="width: 1px; height: 18px; background: #2E343B; margin: 0 6px;"></span>
    <div onClick="{{ toggleGrid }}" style="{{gridBtn}}">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 5h12M1 9h12M5 1v12M9 1v12" stroke="currentColor" stroke-width="1.2"/></svg>
      Grille
    </div>
    <div onClick="{{ toggleSnap }}" style="{{snapBtn}}">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 2"/><rect x="2.5" y="4.5" width="9" height="5" rx="1.4" stroke="currentColor" stroke-width="1.3"/></svg>
      Aimant
    </div>
    <div style="display: flex; align-items: center; gap: 2px; height: 30px; padding: 0 4px; background: #17191D; border: 1px solid #262B31; border-radius: 9px;">
      <span onClick="{{ gridDown }}" class="vx-tool" style="display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; color: #9AA3AC; font-size: 14px; cursor: pointer;">&#8722;</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #ECEFF2; width: 34px; text-align: center;">{{gridSize}} px</span>
      <span onClick="{{ gridUp }}" class="vx-tool" style="display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; color: #9AA3AC; font-size: 14px; cursor: pointer;">+</span>
    </div>
    <span style="width: 1px; height: 18px; background: #2E343B; margin: 0 4px;"></span>
    <div style="{{doneBtn}}">Terminé</div>
  </div>

  <div style="position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); font-size: 11px; color: #6B7480;">Glissez pour déplacer · Maj + flèches pour ajuster au pixel · Échap pour sortir</div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#3DDC84","options":["#3DDC84","#F0BA54","#7C8CFF","#FF8A4C"],"section":"Th&#232;me"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'cps', grid: true, snap: true, size: 8, locked: false, hidden: {} };
  }

  boxes() {
    return {
      fps:    { x: 28,   y: 26,  w: 96,  h: 34, name: 'FPS' },
      cps:    { x: 28,   y: 70,  w: 96,  h: 34, name: 'CPS' },
      coords: { x: 28,   y: 632, w: 234, h: 34, name: 'Coordonnées' },
      keys:   { x: 28,   y: 300, w: 116, h: 96, name: 'Keystrokes' },
      ping:   { x: 1132, y: 26,  w: 120, h: 34, name: 'Ping' },
      graph:  { x: 1032, y: 606, w: 220, h: 62, name: 'Graphique FPS' }
    };
  }

  panel(id, extra) {
    const b = this.boxes()[id];
    const gone = this.state.hidden[id];
    return 'position: absolute; left: ' + b.x + 'px; top: ' + b.y + 'px; width: ' + b.w + 'px; height: ' + b.h + 'px; ' +
      'display: ' + (gone ? 'none' : 'flex') + '; align-items: center; gap: 8px; padding: 0 10px; ' +
      'background: rgba(14,16,19,0.62); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; ' +
      'backdrop-filter: blur(6px); ' + (extra || '');
  }

  key(on, accent, wide) {
    const bg = on ? accent : 'rgba(255,255,255,0.10)';
    const fg = on ? '#0E1512' : '#C9D0D7';
    const w = wide ? '56px' : '26px';
    return 'display: flex; align-items: center; justify-content: center; width: ' + w + '; height: 26px; border-radius: 7px; ' +
      'font-family: \'JetBrains Mono\', monospace; font-size: 11px; font-weight: 500; background: ' + bg + '; color: ' + fg + ';';
  }

  renderVals() {
    const accent = this.props.accent ?? '#3DDC84';
    const s = this.state;
    const b = this.boxes()[s.sel];
    const heights = [12, 18, 15, 22, 19, 26, 21, 17, 24, 20, 28, 23, 16, 25, 19, 22, 27, 20];

    const handle = (dx, dy) => 'position: absolute; ' + dx + ': -4px; ' + dy + ': -4px; width: 7px; height: 7px; border-radius: 2px; background: #0E0F11; border: 1.5px solid ' + accent + ';';
    const toolBtn = (on) => 'display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 9px; font-size: 11.5px; cursor: pointer; transition: all .12s; ' +
      'background: ' + (on ? 'rgba(61,220,132,0.12)' : 'transparent') + '; color: ' + (on ? accent : '#7C858F') + '; border: 1px solid ' + (on ? 'rgba(61,220,132,0.22)' : '#262B31') + ';';

    return {
      accent: accent,
      gridStyle: 'position: absolute; inset: 0; pointer-events: none; opacity: ' + (s.grid ? '1' : '0') + '; ' +
        'background-image: linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px); ' +
        'background-size: ' + (s.size * 4) + 'px ' + (s.size * 4) + 'px;',

      fpsBox: this.panel('fps'),
      cpsBox: this.panel('cps'),
      coordsBox: this.panel('coords'),
      keysBox: this.panel('keys', 'flex-direction: column; justify-content: center; gap: 4px; padding: 8px;'),
      pingBox: this.panel('ping'),
      graphBox: this.panel('graph', 'flex-direction: column; align-items: stretch; justify-content: center; gap: 5px; padding: 8px 10px;'),

      keyOn: this.key(true, accent, false),
      keyOff: this.key(false, accent, false),
      keyWide: this.key(false, accent, true),

      bars: heights.map((h, i) => ({
        style: 'width: 5px; height: ' + h + 'px; border-radius: 2px; background: ' + (i > 13 ? accent : 'rgba(61,220,132,0.42)') + ';'
      })),

      pickFps: () => this.setState({ sel: 'fps' }),
      pickCps: () => this.setState({ sel: 'cps' }),
      pickCoords: () => this.setState({ sel: 'coords' }),
      pickKeys: () => this.setState({ sel: 'keys' }),
      pickPing: () => this.setState({ sel: 'ping' }),
      pickGraph: () => this.setState({ sel: 'graph' }),

      selName: b.name,
      ringStyle: 'position: absolute; left: ' + (b.x - 3) + 'px; top: ' + (b.y - 3) + 'px; width: ' + (b.w + 6) + 'px; height: ' + (b.h + 6) + 'px; ' +
        'border: 1.5px solid ' + accent + '; border-radius: 12px; pointer-events: none; display: ' + (s.hidden[s.sel] ? 'none' : 'block') + ';',
      h1: handle('left', 'top'),
      h2: handle('right', 'top'),
      h3: handle('left', 'bottom'),
      h4: handle('right', 'bottom'),

      toolbarStyle: 'position: absolute; left: ' + (b.x - 3) + 'px; top: ' + (b.y - 45) + 'px; display: ' + (s.hidden[s.sel] ? 'none' : 'flex') + '; align-items: center; gap: 2px; ' +
        'height: 36px; padding-right: 4px; background: rgba(19,21,24,0.96); border: 1px solid #2A2F35; border-radius: 11px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);',
      lockColor: s.locked ? accent : '#9AA3AC',
      toggleLock: () => this.setState({ locked: !s.locked }),
      hideSel: () => { const n = Object.assign({}, s.hidden); n[s.sel] = true; this.setState({ hidden: n }); },
      openSettings: () => this.setState({ locked: s.locked }),

      guideV: 'position: absolute; left: ' + b.x + 'px; top: 0; bottom: 0; width: 1px; pointer-events: none; ' +
        'display: ' + (s.snap && !s.hidden[s.sel] ? 'block' : 'none') + '; background: repeating-linear-gradient(to bottom, ' + accent + ' 0 4px, transparent 4px 9px); opacity: 0.55;',
      guideH: 'position: absolute; top: ' + (b.y + b.h) + 'px; left: 0; right: 0; height: 1px; pointer-events: none; ' +
        'display: ' + (s.snap && !s.hidden[s.sel] ? 'block' : 'none') + '; background: repeating-linear-gradient(to right, ' + accent + ' 0 4px, transparent 4px 9px); opacity: 0.35;',
      gapBadge: 'position: absolute; left: ' + (b.x + b.w + 12) + 'px; top: ' + (b.y + b.h / 2 - 9) + 'px; display: ' + (s.snap && !s.hidden[s.sel] ? 'flex' : 'none') + '; ' +
        'align-items: center; height: 18px; padding: 0 7px; border-radius: 5px; background: ' + accent + '; color: #0E1512; ' +
        'font-family: \'JetBrains Mono\', monospace; font-size: 10px; font-weight: 700;',
      gapText: b.x + ' px',

      grid: s.grid,
      snap: s.snap,
      gridSize: s.size,
      gridBtn: toolBtn(s.grid),
      snapBtn: toolBtn(s.snap),
      toggleGrid: () => this.setState({ grid: !s.grid }),
      toggleSnap: () => this.setState({ snap: !s.snap }),
      gridUp: () => this.setState({ size: Math.min(32, s.size * 2) }),
      gridDown: () => this.setState({ size: Math.max(2, Math.round(s.size / 2)) }),
      doneBtn: 'display: flex; align-items: center; height: 30px; padding: 0 16px; border-radius: 9px; font-size: 12px; font-weight: 600; cursor: pointer; background: ' + accent + '; color: #0E1512;'
    };
  }
}
</script>
</body>
</html>
