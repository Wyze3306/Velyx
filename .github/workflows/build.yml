name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-cross:
    name: Linux (mingw-w64 -> Windows x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake ninja-build

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-mingw64.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DVELYX_WERROR=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Stage assets
        run: |
          mkdir -p build/bin/assets
          cp -r assets/* build/bin/assets/

      - uses: actions/upload-artifact@v4
        with:
          name: velyx-mingw
          path: |
            build/bin/Velyx.dll
            build/bin/Velyx.exe
            build/bin/assets

  windows-msvc:
    name: Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: velyx-msvc
          path: |
            build/bin/Release/Velyx.dll
            build/bin/Release/Velyx.exe
